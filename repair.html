<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ซ่อมการเปิดเช็คเอง</title><style>body{font:17px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;color:#203957;background:#edf7ff;margin:0;padding:28px}main{max-width:520px;margin:auto}button{font:inherit;background:#0665ff;color:white;padding:14px 20px;border:0;border-radius:12px;min-height:48px}p{overflow-wrap:anywhere}</style></head><body><main><h1>ซ่อมการเปิดเช็คเอง</h1><p>ล้างเฉพาะแคชไฟล์เว็บและการลงทะเบียน service worker เก่า รายชื่อ คะแนน และการเชื่อมต่อ Sheets ยังอยู่</p><button id="repair">ซ่อมและเปิดแอป</button><p id="status" role="status"></p></main><script>document.getElementById('repair').onclick=async function(){this.disabled=true;const status=document.getElementById('status');try{status.textContent='กำลังซ่อมแคช…';const scope=new URL('./',location.href).href;if('serviceWorker'in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.filter(r=>r.scope===scope).map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('checkeng-app-')).map(k=>caches.delete(k)));}location.replace(new URL('./?updated=24#home',location.href).href);}catch(e){status.textContent='ยังซ่อมไม่สำเร็จ: '+e.message;this.disabled=false;}};</script></body></html>
